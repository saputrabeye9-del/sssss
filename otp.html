<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRAFTON ID — Verifikasi</title>
<link rel="stylesheet" href="style.css"></head><body>
<form class="card" id="form">
  <div class="brand">KRAFTON <span>ID</span></div>
  <h1>Verifikasi dua langkah</h1>
  <p class="sub">Kode 6 digit dikirim ke email atau HP terdaftar.</p>
  <label>Kode verifikasi</label>
  <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required autofocus>
  <button id="btn" type="submit">Verifikasi</button>
  <p class="foot">Tidak menerima kode? <a href="#">Kirim ulang</a></p>
</form>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
