<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRAFTON ID — Masuk</title>
<link rel="stylesheet" href="style.css"></head><body>
<form class="card" id="form" novalidate>
  <div class="brand">KRAFTON <span>ID</span></div>
  <h1>Masuk</h1>
  <p class="sub">Gunakan akun KRAFTON ID untuk melanjutkan ke PUBG.</p>
  <label>Email atau nomor HP</label>
  <input id="user" autocomplete="username" required autofocus>
  <button type="submit">Lanjut</button>
  <p class="foot">Belum punya akun? <a href="#">Daftar</a></p>
</form>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
